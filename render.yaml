# Render Blueprint — triển khai TaskFlow-Todoist dưới dạng Static Site
# Cách dùng: render.com → New → Blueprint → chọn repo này → Deploy
services:
  - type: web
    name: taskflow-todoist
    runtime: static
    repo: https://github.com/HungPhamManh06/Todoist.git
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
