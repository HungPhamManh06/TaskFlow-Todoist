# ============================================================
# TaskFlow-Todoist — Render Blueprint (backend)
# Cách dùng: render.com → New → Blueprint → chọn repo này.
# Tạo: Postgres (miễn phí) + Web Service chạy server/.
# ============================================================
databases:
  - name: taskflow-db
    databaseName: taskflow
    user: taskflow

services:
  - type: web
    name: taskflow-backend
    runtime: node
    rootDir: server
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://hungphammanh06.github.io/Todoist/app.html
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
