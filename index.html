  <!-- ===== Open Graph / Facebook ===== -->

    content="Planner tiếng Việt miễn phí: mục tiêu năm/tháng/tuần, habit tracker 31 ngày, checklist & reflection. Offline 100%." />

  <!-- ===== Favicon (emoji) ===== -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐥</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Quicksand:wght@600;700&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=15" />
</head>

<body>
  <div class="bricks bricks-top" aria-hidden="true"></div>

  <header class="site-header">
    <div class="brand">
      <span class="brand-chick" aria-hidden="true">🐥</span>
      <div class="brand-text">
        <h1 id="brandTitle">TaskFlow-Todoist</h1>
        <p id="brandSub">Kế hoạch tháng 1 · 2026</p>
      </div>
    </div>
    <nav class="month-nav" aria-label="Chuyển tháng trong năm" data-i18n-aria="navMonths">
      <button type="button" class="btn-month" data-action="prevmonth" title="Tháng trước" aria-label="Tháng trước"
        data-i18n-title="prevMonth" data-i18n-aria="prevMonth">‹</button>
      <select id="monthSelect" class="month-select" data-action="monthselect" aria-label="Chọn tháng"
        data-i18n-aria="selectMonth"></select>
      <button type="button" class="btn-month" data-action="nextmonth" title="Tháng sau" aria-label="Tháng sau"
        data-i18n-title="nextMonth" data-i18n-aria="nextMonth">›</button>
    </nav>
    <nav class="tabs" id="navTabs" role="tablist" aria-label="Điều hướng kế hoạch" data-i18n-aria="navPlan"></nav>
    <button type="button" class="btn-reset" data-action="reset" title="Xoá toàn bộ dữ liệu đã lưu"
      data-i18n-title="resetTitle" data-i18n="resetTxt">↺ Đặt lại</button>
    <button type="button" class="btn-now" id="btnNow" data-action="gotoday" title="Về hôm nay & tuần hiện tại"
      data-i18n-title="todayTitle" data-i18n="todayTxt">📍 Hôm nay</button>
    <div class="now" id="nowBox" aria-label="Ngày giờ hiện tại" data-i18n-aria="nowAria"><span
        aria-hidden="true">🕗</span><span id="nowText"></span></div>
    <div class="header-controls">
      <div class="theme-picker" role="group" aria-label="Chọn chủ đề màu">
        <button type="button" class="theme-dot dot-cream" data-action="theme" data-theme="cream" title="Cream"
          aria-label="Chủ đề kem"></button>
        <button type="button" class="theme-dot dot-mint" data-action="theme" data-theme="mint" title="Mint"
          aria-label="Chủ đề bạc hà"></button>
        <button type="button" class="theme-dot dot-lavender" data-action="theme" data-theme="lavender" title="Lavender"
          aria-label="Chủ đề oải hương"></button>
        <button type="button" class="theme-dot dot-peach" data-action="theme" data-theme="peach" title="Peach"
          aria-label="Chủ đề đào"></button>
      </div>
      <button type="button" class="lang-btn" id="langBtn" data-action="lang"
        title="Đổi ngôn ngữ / Switch language">EN</button>
    </div>
  </header>

  <main class="container">
    <section id="view-overview" class="view" role="tabpanel" aria-label="Tổng quan tháng" data-i18n-aria="viewOverview">
      <div class="landing-hero">
        <video class="landing-video"
          src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260314_131748_f2ca2a28-fed7-44c8-b9a9-bd9acdd5ec31.mp4"
          autoplay loop muted playsinline aria-hidden="true"></video>
        <div class="landing-overlay" aria-hidden="true"></div>
        <div class="landing-inner">
          <p class="landing-logo">TaskFlow-Todoist</p>
          <h2 class="landing-title">Where <em>dreams</em> rise through <em>the silence.</em></h2>
          <p class="landing-sub">We&rsquo;re designing tools for deep thinkers, bold creators, and quiet rebels. Amid
            the chaos, we build digital spaces for sharp focus and inspired work.</p>
          <button type="button" class="landing-cta" data-action="journey">Begin Journey</button>
        </div>
      </div>
      <div id="ov-content"></div>
    </section>
    <section id="view-year" class="view" role="tabpanel" aria-label="Kế hoạch năm" data-i18n-aria="viewYear"></section>
    <section id="view-week" class="view" role="tabpanel" aria-label="Kế hoạch tuần" data-i18n-aria="viewWeek"></section>
  </main>

  <footer class="bricks bricks-bottom" aria-hidden="true"></footer>

  <script src="js/app.js?v=17"></script>
</body>

</html>
