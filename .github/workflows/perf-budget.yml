# Perf budget gate (Lớp 3 — P3.1).
#
# Deliberately NOT part of ci.yml: Lighthouse needs Chrome + a live server and
# takes minutes, while the PR feedback loop is currently ~2 minutes. Regression
# floors are enforced here (nightly + on demand); the P1.2 targets are printed
# on every run and only enforced by --strict, which is the "have we reached the
# goal yet" switch (see docs/v3.2-three-layer-plan.md).
name: Perf budget

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC nightly
  workflow_dispatch:

jobs:
  perf-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # lighthouse@13 khai báo engines.node >= 22.19 — chạy bằng Node 20 thì mọi lượt
      # đo fail ngay (run #1 ngày 2026-09-22: 4/4 combo fail, không có report nào) và
      # gate đỏ với thông báo "no reports to evaluate" dù sản phẩm không hề regression.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Đo ĐÚNG artifact production (dist/ + boot bundle), không phải source tree:
      # source phục vụ 68 file script riêng, dist phục vụ 1 bundle.
      - name: Build dist
        run: |
          npm install
          npm run build

      # Preflight: nói thẳng thiếu gì (lighthouse/Chrome) TRƯỚC khi đo, để lỗi hạ tầng
      # không bị báo nhầm thành lỗi hiệu năng.
      - name: Preflight — Lighthouse + Chrome
        run: |
          npx --yes lighthouse@13.4.1 --version
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::Không tìm thấy Chrome trên runner — không thể đo hiệu năng"
            exit 1
          fi
          "$CHROME" --version
          # chrome_args() của scripts/measure-lighthouse.py đọc biến này (không có
          # đường dẫn Windows /usr/bin/google-chrome của runner).
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: Measure landing + app against the budget floors
        run: python scripts/perf-budget.py --out perf-reports --serve dist --runs 2

      - name: Report the P1.2 target gap (non-blocking)
        run: python scripts/perf-budget.py --from-dir perf-reports --strict || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-reports
          path: perf-reports/
          if-no-files-found: warn
