name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Production URL to test'
        required: false
        default: 'https://taskflow-todoist.vercel.app'
      expected_sha:
        description: 'Expected deployment SHA (optional — printed for manual verification)'
        required: false

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Print release evidence
        run: |
          echo "=== Release Evidence ==="
          echo "Git SHA:       $(git rev-parse HEAD)"
          echo "Base URL:      ${{ inputs.base_url }}"
          echo "Expected SHA:  ${{ inputs.expected_sha || '(not provided)' }}"
          echo "========================"

      - name: Install Playwright (Python, Chromium)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Production Smoke Test
        run: python scripts/e2e-production-smoke.py --base-url "${{ inputs.base_url }}"
