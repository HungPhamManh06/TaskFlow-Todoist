name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        run: cd server && npm ci

      - name: Syntax check JS
        run: |
          for f in js/app.js js/sync.js js/plan-math.js js/plan-stats.js js/deeplink.js js/api-config.js; do
            node --check "$f"
          done
          for f in js/*.min.js; do node --check "$f"; done
          cd server && node --check index.js && node --check auth.js && node --check sync.js && node --check db.js

      - name: Canonical AI tool contracts up to date
        run: node scripts/generate-ai-tool-contracts.mjs --check

      - name: Minified assets up to date (P1.2 opt#1)
        run: |
          npx --yes terser@5 --version >/dev/null 2>&1
          npx --yes csso-cli@4 --version >/dev/null 2>&1
          python scripts/minify.py --check

      - name: Unit tests (phase0 + phase1 + phase2)
        run: node --test tests/*.test.mjs

      - name: Sync logic test (backend pg-mem + client sync engine)
        run: node test-sync.js

      - name: Server security test (JWT fail-fast, CORS allowlist, headers, rate limit)
        run: node test-server-security.js

  # Release-asset cache-bust consistency: every ?v=N pin in app.html must be at
  # least as new as the last commit that changed the asset, or a stale SW cache
  # could serve mismatched HTML/JS on first load after deploy (see 2824e39).
  # Needs FULL history (git log -S pickaxe) — shallow checkout would miss it.
  release-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Versioned assets in app.html consistent with their last commit"
        run: python scripts/check-release-assets.py

  # Critical smoke suite runs on all three engines (P1.2). The suite is
  # deterministic across engines: it emulates prefers-reduced-motion (the app
  # honors it) so smooth-scroll timing can't race clicks, and measures geometry
  # in single evaluates. fail-fast: false so one engine's failure doesn't mask
  # the others' results.
  e2e-smoke:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright engine (${{ matrix.browser }})
        run: |
          pip install playwright
          python -m playwright install --with-deps ${{ matrix.browser }}

      - name: "E2E smoke (${{ matrix.browser }}: load → toggle habit → switch view → export)"
        run: python scripts/e2e-smoke.py --browser ${{ matrix.browser }}

  # Full frontend suite stays Chromium-only (11 scenarios × 5 viewports); the
  # cross-engine coverage lives in the smoke matrix above.
  e2e-frontend:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright (Python, Chromium)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: E2E frontend suite (landing/overview/week/year/calendar/dialogs/focus × desktop/tablet/mobile)
        run: python scripts/e2e-frontend.py --all

  # Offline PWA hardening: reproduces the Vercel cleanUrls environment (HTML
  # navigation responses carry Content-Disposition: inline; filename="...")
  # and verifies every first-party route loads offline through a REAL service
  # worker lifecycle, plus the SW upgrade purge (old cache generation removed,
  # current + digest retained). Chromium only — the cross-engine smoke matrix
  # above covers the other engines.
  offline-e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright (Python, Chromium)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Offline PWA e2e (routes, content, header invariant, SW upgrade)
        run: python scripts/e2e-offline.py

  # Document Daily Planner E2E: covers the full PDF → Roadmap → Daily Plan
  # → Review → Apply → Undo → Next Week flow with real browser orchestration.
  # Uses Playwright route interception for deterministic API responses.
  document-daily-plan-e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright (Python, Chromium)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: "Document Daily Planner E2E (PDF → Roadmap → Daily Plan → Review → Apply → Undo → Next Week)"
        run: python scripts/e2e-document-daily-plan.py
