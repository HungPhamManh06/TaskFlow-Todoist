<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>OG Preview</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Nunito', 'Segoe UI', sans-serif;
    color: #4A403A;
    background:
      radial-gradient(700px 380px at 90% -60px, rgba(243, 154, 130, .35), transparent 60%),
      radial-gradient(600px 340px at -40px 90%, rgba(168, 195, 160, .4), transparent 60%),
      #EFE6D5;
    display: flex;
    align-items: center;
    padding: 0 64px;
    position: relative;
  }
  .bricks {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 18px;
    background:
      linear-gradient(90deg, #D9CDB6 24px, transparent 24px) 0 0 / 48px 100%,
      linear-gradient(90deg, #E3D9C4 24px, transparent 24px) 24px 0 / 48px 100%;
  }
  .left { width: 640px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 24px; }
  .brand .chick { font-size: 34px; }
  .badge {
    display: inline-block;
    margin-top: 18px;
    background: #fff;
    border: 2px solid #E4DAC8;
    border-radius: 999px;
    padding: 8px 16px;
    font-weight: 800;
    font-size: 16px;
  }
  h1 {
    font-family: 'Baloo 2', 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 52px;
    line-height: 1.14;
    margin-top: 20px;
    color: #4A403A;
  }
  h1 em { font-style: normal; font-weight: 800; color: #C24E28; }
  .sub {
    margin-top: 14px;
    font-size: 20px;
    font-weight: 700;
    color: #8B7F73;
    line-height: 1.5;
  }
  .cta {
    display: inline-block;
    margin-top: 22px;
    background: #C24E28;
    color: #fff;
    font-weight: 800;
    font-size: 18px;
    border-radius: 999px;
    padding: 12px 24px;
  }
  .card {
    margin-left: auto;
    width: 430px;
    background: #FFFDF8;
    border: 2px solid #E4DAC8;
    border-radius: 20px;
    padding: 22px 24px;
    box-shadow: 0 22px 48px rgba(74, 64, 58, .18);
    transform: rotate(2.5deg);
  }
  .card-head { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; margin-bottom: 16px; }
  .card-head .chick { font-size: 26px; }
  .note-text { margin: 0 0 14px; font-weight: 700; font-size: 15px; line-height: 1.6; }
  .note-lines { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .note-lines span { height: 8px; border-radius: 999px; background: rgba(243, 154, 130, .22); }
  .note-lines span:nth-child(2) { width: 86%; background: rgba(168, 195, 160, .3); }
  .note-lines span:nth-child(3) { width: 60%; background: rgba(243, 154, 130, .16); }
  .foot { display: flex; justify-content: space-between; margin-top: 0; padding-top: 12px; border-top: 2px dashed #E4DAC8; font-weight: 800; font-size: 14px; color: #C24E28; }
</style>
</head>
<body>
  <div class="bricks"></div>
  <div class="left">
    <div class="brand"><span class="chick">🐥</span>TaskFlow-Todoist</div>
    <div class="badge">🎀 100% miễn phí, không cần tài khoản</div>
    <h1>Kế hoạch năm, tháng &amp; tuần <em>theo cách dễ thương</em></h1>
    <div class="sub">Mục tiêu · Habit tracker 31 ngày + streak 🔥 · Checklist &amp; Reflection</div>
    <div class="cta">🐥 Mở kế hoạch</div>
  </div>
  <div class="card">
    <div class="card-head"><span class="chick">🐥</span>Ghi chú tuần này</div>
    <p class="note-text">Mỗi ngày một bước nhỏ, cuối năm bạn sẽ thấy mình đã đi rất xa. 🌱</p>
    <div class="note-lines"><span></span><span></span><span></span></div>
    <div class="foot"><span>🔥 Streak 7 ngày</span><span>🏆 12 ngày</span></div>
  </div>
</body>
</html>
